name: CI

# RNF06: build and tests on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Runs the unit tests, the Testcontainers tests (the runner already has
      # Docker), the ArchUnit architecture tests and the JaCoCo coverage check:
      # `verify` fails when the covered ratio of instructions or of lines drops
      # below jacoco.minimum.coverage (95%, see the pom), for the whole code and
      # for the domain and the application. No secrets are needed.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # RNF26: the container image must build. It is only built here, never published, and a build that
      # breaks fails the job (and so the `verify` check that the main branch requires). The tests already ran
      # above, so the image build skips them.
      - name: Build the Docker image
        run: docker build --tag booksmanager:ci .

      # RNF26: the production Compose file must stay valid. Only parsed here, never started; the two variables
      # that the sample leaves empty (they are required in a real deployment) get a dummy value just for this check.
      - name: Validate the production Compose file
        run: POSTGRES_PASSWORD=ci APP_JWT_SECRET=ci docker compose --env-file .env.prod-sample -f compose.prod.yaml config --quiet

      # RNF13: the Nginx configuration (with the limit of the login attempts) must stay valid. Only checked here, never
      # started: a throwaway certificate and a fake "app" host are enough for `nginx -t`.
      - name: Validate the Nginx configuration
        run: |
          certs=$(mktemp -d)
          mkdir -p "$certs/live/ci"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$certs/live/ci/privkey.pem" -out "$certs/live/ci/fullchain.pem"
          docker run --rm --add-host app:127.0.0.1 -e DOMAIN=ci \
            -v "$PWD/deploy/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$certs:/etc/letsencrypt:ro" nginx:1.28-alpine nginx -t

      # Shows the numbers on the run page, also when the coverage check fails.
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(path):
              print("No coverage report: the build stopped before the JaCoCo report.")
              raise SystemExit
          rows = list(csv.DictReader(open(path)))
          def ratio(select):
              out = {}
              for counter in ("INSTRUCTION", "LINE", "BRANCH"):
                  missed = sum(int(r[counter + "_MISSED"]) for r in rows if select(r["PACKAGE"]))
                  covered = sum(int(r[counter + "_COVERED"]) for r in rows if select(r["PACKAGE"]))
                  out[counter] = 100.0 * covered / (missed + covered) if missed + covered else 100.0
              return out
          layers = ("All the code", lambda p: True), ("Domain and application", lambda p: p.endswith("domain") or ".application" in p)
          print("### Code coverage (JaCoCo)")
          print()
          print("| Scope | Instructions | Lines | Branches |")
          print("| --- | ---: | ---: | ---: |")
          for name, select in layers:
              r = ratio(select)
              print(f"| {name} | {r['INSTRUCTION']:.1f}% | {r['LINE']:.1f}% | {r['BRANCH']:.1f}% |")
          print()
          print("The build fails when instructions or lines drop below 95% (`jacoco.minimum.coverage` in the pom). Branches are only reported.")
          PY

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 7
