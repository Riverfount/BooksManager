spring.application.name=BooksManager

# RNF03: o esquema é criado e alterado apenas pelo Flyway; o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RNF04: erros da API no formato ProblemDetail (RFC 9457), inclusive os
# 400 de Bean Validation que o Spring já trata.
spring.mvc.problemdetails.enabled=true
