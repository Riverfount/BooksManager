spring.application.name=BooksManager

# Local development reads the .env file (see application-local.properties), so
# the variables of the README need not be exported by hand. It is the default
# profile: set SPRING_PROFILES_ACTIVE (for example, "prod") to run without it.
# The tests turn it off.
spring.profiles.default=local

# RNF03: the schema is created and altered only by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RNF04: API errors in ProblemDetail format (RFC 9457), including the
# 400s from Bean Validation that Spring already handles.
spring.mvc.problemdetails.enabled=true

# RNF23: only the health endpoint is exposed. The components (including the
# database) are listed with their status, but the details stay hidden so
# the public endpoint does not leak connection data. The security chain
# permits this route explicitly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# RNF09: origins allowed to call the API from a browser, comma separated.
# Empty (nothing allowed) unless APP_CORS_ALLOWED_ORIGINS is set (RNF10).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# RF08, RNF10: login and password of the initial administrator, created at
# startup only if there is no user at all. Empty (nothing created) unless
# APP_ADMIN_LOGIN and APP_ADMIN_PASSWORD are both set; the password never
# goes in a migration or a versioned file.
app.admin.login=${APP_ADMIN_LOGIN:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# RF08, RNF08, RNF10: JWT access token, HS256. The secret comes only from the
# environment (APP_JWT_SECRET, at least 32 bytes) and the application does not
# start without it; the issuer is checked on every token.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=booksmanager
# Access token lifetime (RF08).
app.jwt.access-token-ttl=15m

# RF08: the refresh token is opaque, lives for 7 days and travels in an httpOnly
# cookie, only on the authentication routes. SameSite=Strict because the
# front-end and the API are on the same site (decided on 15/10/2026); Secure is
# on by default (browsers also accept it on http://localhost).
app.auth.refresh-token-ttl=7d
app.auth.refresh-cookie.name=refresh_token
app.auth.refresh-cookie.secure=true
app.auth.refresh-cookie.same-site=Strict
app.auth.refresh-cookie.path=/api/v1/auth

# RF08: login lockout. After this many wrong passwords in a row the user is
# blocked for the given time, and the block ends by itself. The manual unblock
# by an administrator comes with the user management (issue #108).
app.login-lockout.max-failed-attempts=3
app.login-lockout.block-duration=15m

# RF19, RN13: the routine that expires the reservations whose pickup deadline passed and passes the copy on to the
# next of the queue. It is only a trigger of a use case that is idempotent; it also runs once when the application
# is ready, to recover a day that was missed. The time is a Spring cron (second, minute, hour, day, month, weekday),
# read in the declared zone, not in the zone of the container; the tests turn the routine off.
app.reservations.expiration.enabled=true
app.reservations.expiration.cron=0 0 3 * * *
app.reservations.expiration.zone=America/Sao_Paulo

# RF28, RNF19: e-mail notifications. Off by default, so no e-mail leaves by mistake: while it is off the sender only
# logs the subject. To turn it on, set APP_MAIL_ENABLED=true plus the host and the sender address (the port, the
# credentials and the STARTTLS are optional); nothing about the server is written in a versioned file (RNF10).
# Short timeouts, so a server that does not answer cannot hold a request thread.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.host=${APP_MAIL_HOST:}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:}
app.mail.password=${APP_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:}
app.mail.start-tls=${APP_MAIL_STARTTLS:true}
app.mail.connection-timeout=3s
app.mail.timeout=5s

# An unreachable mail server must not turn the health check (and the container) to DOWN: the mail is not essential.
management.health.mail.enabled=false
