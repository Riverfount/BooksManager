spring.application.name=BooksManager

# RNF03: the schema is created and altered only by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RNF04: API errors in ProblemDetail format (RFC 9457), including the
# 400s from Bean Validation that Spring already handles.
spring.mvc.problemdetails.enabled=true

# RNF23: only the health endpoint is exposed. The components (including the
# database) are listed with their status, but the details stay hidden so
# the public endpoint does not leak connection data. While there is no
# custom SecurityFilterChain, Spring Boot already lets /actuator/health
# through without login; when the authentication phase adds one, it must
# permit this route explicitly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
