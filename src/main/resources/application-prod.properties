# Production profile (RNF09, RNF10, RNF12). Activate it with SPRING_PROFILES_ACTIVE=prod (the container image
# already does). It replaces the default "local" profile, so the .env file is never read here: the secrets and the
# connection to the database come only from environment variables (APP_JWT_SECRET, APP_ADMIN_LOGIN,
# APP_ADMIN_PASSWORD, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD). Nothing
# secret is written in this file, and the origin allowed by CORS is still APP_CORS_ALLOWED_ORIGINS.

# RNF12: the application runs behind a reverse proxy that ends the TLS. Trust its X-Forwarded-* headers, so the
# Location of a 201 is built with https and the public host instead of the plain http address the proxy talks to.
# "native" is the Tomcat way (RemoteIpValve), and it only honors the headers of a proxy on an internal address
# (loopback and the private ranges, such as the network of the Docker Compose), never those of a client that
# reaches the application directly from the internet. Keep the application off the public network: only the proxy
# should reach its port.
server.forward-headers-strategy=native

# RNF23: only the health endpoint is exposed, and it says nothing more than UP or DOWN: no details and no list of
# components (the database among them). The container health check only needs the status code.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# The refresh token cookie stays Secure (RF08): the browser reaches the API over https, through the proxy.
app.auth.refresh-cookie.secure=true

# RF19, RN13: the routine that expires the reservations is on in production (03:00 of America/Sao_Paulo, and once
# when the application starts). The tests turn it off in their own configuration.
app.reservations.expiration.enabled=true

# Logs for a container (read from the standard output): no colors, INFO as the level, no SQL, and an error answer
# never carries a stack trace or an internal message to the client. The Swagger and the OpenAPI stay public, as
# decided on 15/10/2026.
spring.output.ansi.enabled=never
logging.level.root=INFO
logging.level.com.riverfount.booksmanager=INFO
spring.jpa.show-sql=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
