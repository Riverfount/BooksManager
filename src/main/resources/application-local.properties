# Local development: also read the variables of the .env file in the working
# directory (the same file Docker Compose uses), so APP_JWT_SECRET,
# APP_CORS_ALLOWED_ORIGINS, APP_ADMIN_LOGIN and the like need not be exported
# by hand. Optional (no error without the file); a real environment variable
# wins over the file.
spring.config.import=optional:file:.env[.properties]
