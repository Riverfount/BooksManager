# The Spring test context cache holds 32 contexts by default and evicts the oldest beyond that. This suite creates
# more than 32 (each @WebMvcTest with its own set of mocks is one), and once it did, the tests that ran last failed
# with "connection has been closed" and waited a minute each (seen in NotificationSenderTransactionIntegrationTest,
# which passes alone). A limit well above the number of contexts keeps every context alive for the whole run.
# Raise it again if the suite grows near it.
spring.test.context.cache.maxSize=64
