# Test-only configuration. It lives in config/ so that it is loaded on top of
# the main application.properties instead of replacing it.
#
# The "test" profile replaces the default "local" one, which would read the
# developer's .env and let local values (a CORS origin, the initial
# administrator) leak into the tests.
spring.profiles.active=test

# Not a real secret: only so that the JWT beans can be built in the tests.
app.jwt.secret=test-only-secret-not-for-use-0123456789-abcdef

# Hibernate statistics on in every test, so that the query-count tests share the Spring context of the others
# instead of starting one each (the counters cost almost nothing).
spring.jpa.properties.hibernate.generate_statistics=true

# The routine that expires reservations must never fire by itself in a test (it would also run at startup);
# the tests call the use case or the trigger directly.
app.reservations.expiration.enabled=false

# The routine that notifies the loans must never fire by itself in a test either.
app.loan-notices.enabled=false

# No e-mail leaves a test, whatever the environment of the machine says.
app.mail.enabled=false

# No call to the network leaves a test, whatever the environment of the machine says.
app.isbn-lookup.enabled=false

# Every Spring context of the suite keeps its own connection pool to the one PostgreSQL of the tests, and the contexts
# stay alive for the whole run (see spring.properties). With the default pool (10 connections, all kept open) a few
# contexts are enough to pass the 100 connections that PostgreSQL accepts, and the tests that ran last failed with
# "sorry, too many clients already" (seen in CI, in LoanReturnConditionBackfillTest). A pool starts with one
# connection, grows only while a test needs it, and gives the idle ones back after 10 seconds.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
